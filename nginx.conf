# Nginx runs on port 8081; Traefik terminates TLS on 80/443 and forwards
# kangaroopro.com traffic here.
server {
    listen 8081;
    listen [::]:8081;
    server_name kangaroopro.com www.kangaroopro.com;
    root /var/www/kangaroo;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
}
