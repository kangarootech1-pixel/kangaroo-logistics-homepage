# HTTP: serve ACME (Let's Encrypt) challenges, redirect everything else to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name kangaroopro.com www.kangaroopro.com;

    # Allow Let's Encrypt http-01 challenges (issuance + renewals) over plain HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/kangaroo;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS: the actual site.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name kangaroopro.com www.kangaroopro.com;

    ssl_certificate     /etc/letsencrypt/live/kangaroopro.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kangaroopro.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/kangaroo;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
}
