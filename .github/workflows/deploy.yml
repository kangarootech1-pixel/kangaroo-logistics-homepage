name: Deploy to VPS

on:
  push:
    branches: [main]

# Allow only one deploy at a time; don't cancel an in-progress one mid-rsync.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_FORMS_WEBHOOK_URL: ${{ secrets.VITE_FORMS_WEBHOOK_URL }}
          VITE_CHAT_WEBHOOK_URL: ${{ secrets.VITE_CHAT_WEBHOOK_URL }}
        run: npm run build

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy dist/ to VPS via rsync
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            dist/ \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/kangaroo/"

      - name: Reload Nginx
        run: |
          ssh -i ~/.ssh/deploy_key \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "nginx -t && systemctl reload nginx"

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
